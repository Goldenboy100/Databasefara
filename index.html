<head>
    <meta charset="UTF-8">
    <script>
      (function() {
        // Safe JSON.parse
        const originalParse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (text === undefined || text === "undefined") {
            console.warn("JSON.parse prevented crash for undefined input");
            return null;
          }
          try {
            return originalParse(text, reviver);
          } catch (e) {
            console.warn("JSON.parse error", e);
            return null;
          }
        };

        // Safe localStorage
        const safeStorage = {
          getItem: (key) => {
            try { return localStorage.getItem(key); }
            catch (e) { console.warn("localStorage.getItem blocked"); return null; }
          },
          setItem: (key, value) => {
            try { localStorage.setItem(key, value); }
            catch (e) { console.warn("localStorage.setItem blocked"); }
          },
          removeItem: (key) => {
            try { localStorage.removeItem(key); }
            catch (e) { console.warn("localStorage.removeItem blocked"); }
          },
          clear: () => {
            try { localStorage.clear(); }
            catch (e) { console.warn("localStorage.clear blocked"); }
          }
        };
        window.localStorage = safeStorage;
      })();
    </script>
