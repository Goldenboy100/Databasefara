    <script>
      (function() {
        // Omni-Mock v6: Total Canvas & WebGL Immunity
        const nop = () => {};
        const emptyObj = {};
        
        const mockContext = new Proxy({}, {
          get: (target, prop) => {
            if (prop === 'canvas') return mockCanvas;
            if (prop === 'measureText') return () => ({ width: 0, actualBoundingBoxAscent: 0, actualBoundingBoxDescent: 0 });
            if (prop === 'getImageData') return () => ({ data: new Uint8ClampedArray(4), width: 1, height: 1 });
            if (prop === 'getParameter') return () => "Mock";
            if (prop === 'getSupportedExtensions') return () => [];
            if (prop === 'getShaderPrecisionFormat') return () => ({ precision: 23, rangeMin: 127, rangeMax: 127 });
            if (typeof prop === 'string' && (prop.startsWith('create') || prop.startsWith('get') || prop.startsWith('is'))) return () => ({});
            return nop;
          }
        });

        const mockCanvas = new Proxy(document.createElement('div'), {
          get: (target, prop) => {
            if (prop === 'getContext') return () => mockContext;
            if (prop === 'toDataURL') return () => "data:image/png;base64,";
            if (prop === 'toBlob') return (cb) => { if(cb) cb(new Blob()); };
            if (prop === 'style') return {};
            if (prop === 'width') return 300;
            if (prop === 'height') return 150;
            if (prop === 'parentElement') return document.body;
            if (prop === 'nodeType') return 1;
            if (prop === 'tagName') return 'CANVAS';
            return target[prop] || nop;
          }
        });

        function infect(win) {
          if (!win || win.__infected) return;
          try {
            win.__infected = true;
            
            // Prototypes
            if (win.HTMLCanvasElement) win.HTMLCanvasElement.prototype.getContext = () => mockContext;
            if (win.OffscreenCanvas) win.OffscreenCanvas.prototype.getContext = () => mockContext;
            
            // Global Context Classes
            win.WebGLRenderingContext = win.WebGLRenderingContext || function() {};
            win.WebGL2RenderingContext = win.WebGL2RenderingContext || function() {};
            
            // Factory overrides
            const oldCreate = win.document.createElement;
            win.document.createElement = function(tag) {
              try {
                const el = oldCreate.apply(this, arguments);
                if (tag && tag.toLowerCase() === 'canvas') return el || mockCanvas;
                return el;
              } catch(e) {
                if (tag && tag.toLowerCase() === 'canvas') return mockCanvas;
                throw e;
              }
            };

            // Lookup overrides as safety net
            const oldGetId = win.document.getElementById;
            win.document.getElementById = function(id) {
              const el = oldGetId.apply(this, arguments);
              if (!el && id && (id.includes('canvas') || id.includes('google'))) return mockCanvas;
              return el;
            };

            const oldQuery = win.document.querySelector;
            win.document.querySelector = function(sel) {
              const el = oldQuery.apply(this, arguments);
              if (!el && sel && (sel === 'canvas' || sel.includes('canvas'))) return mockCanvas;
              return el;
            };

          } catch(e) {}
        }

        infect(window);

        // Viral infection via Prototype
        const oldAppend = Element.prototype.appendChild;
        Element.prototype.appendChild = function(child) {
          const res = oldAppend.apply(this, arguments);
          if (child && child.tagName === 'IFRAME') {
            try { infect(child.contentWindow); } catch(e) {}
          }
          return res;
        };

        const observer = new MutationObserver((mutations) => {
          for (const m of mutations) {
            for (const node of m.addedNodes) {
              if (node.tagName === 'IFRAME') {
                try { infect(node.contentWindow); } catch(e) {}
              }
            }
          }
        });
        observer.observe(document, { childList: true, subtree: true });
      })();
    </script>
